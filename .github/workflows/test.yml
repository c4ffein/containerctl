name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'  # weekly: the runner's docker moves on without a push of ours (see real-docker)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: ruff format --check
        run: uvx ruff@0.5.1 format --check .
      - name: ruff check
        run: uvx ruff@0.5.1 check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tomllib is stdlib only from 3.11 onwards.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run tests on Python ${{ matrix.python-version }}
        run: uv run --python ${{ matrix.python-version }} python -m unittest discover -s tests

  # What docker says, from docker: tests/test_real_docker.py against the runner's own docker. Everything else fakes it.
  real-docker:
    runs-on: ubuntu-latest
    env:
      CCTL_REAL_DOCKER: '1'  # no docker is then a failure, not a skip
    steps:
      - uses: actions/checkout@v4
      - name: docker version
        run: docker version
      - name: Run the real-docker tests
        run: python3 -m unittest -v tests.test_real_docker
