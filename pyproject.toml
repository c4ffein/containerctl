[project]
name = "containerctl"
version = "0.1.0"
description = "KISS containers CLI/TUI manager, in Python"
authors = [
  { name = "c4ffein", email = "c4ffein.work@gmail.com" },
]
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff==0.5.1"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
